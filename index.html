<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniVoice — Anime Voice Actor Database</title>
    <meta name="description" content="Browse anime, characters, and their voice actors (seiyuu) — a fast, fully static database that runs entirely in your browser via a local SQLite file, no API calls.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z'/%3E%3Cpath d='M19 10v2a7 7 0 0 1-14 0v-2'/%3E%3Cline x1='12' x2='12' y1='19' y2='22'/%3E%3C/svg%3E">
    <link href="/assets/css/style.css" rel="stylesheet">
    <!-- sql.js must execute before main.js — deferred scripts run in document order, so it stays first -->
    <script defer src="/assets/js/vendor/sql-wasm.js"></script>
    <script defer src="/assets/js/main.js"></script>
</head>
<body>
    <noscript>
        <div style="max-width:480px;margin:80px auto;padding:20px;text-align:center;font-family:system-ui,sans-serif;">
            AniVoice needs JavaScript enabled to load and query the local database.
        </div>
    </noscript>
    <nav>
        <div class="container nav-inner">
            <a class="logo" href="#" onclick="showHome(); return false;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" x2="12" y1="19" y2="22"/>
                </svg>
                <span>Ani</span>Voice
            </a>
        </div>
    </nav>
    <!-- Full-page loading screen — visible until DB is ready, then fades out -->
    <div id="loadingScreen">
        <div class="ls-inner">
            <div class="ls-logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" x2="12" y1="19" y2="22"/>
                </svg>
                <span class="ls-wordmark"><span>Ani</span>Voice</span>
            </div>
            <div class="ls-bar-wrap">
                <div class="ls-bar" id="loadBar"></div>
            </div>
            <div class="ls-status" id="loadStatus">Initializing…</div>
        </div>
    </div>

<main class="container">
    <section class="hero" id="hero-section">
        <h1>Anime Voice Actor Database</h1>
        <p id="heroSubtitle"></p>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for anime, characters, or voice actors..." aria-label="Search for anime, characters, or voice actors" autocomplete="off" disabled>
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <div class="results-dropdown" id="searchResults"></div>
        </div>
        <div class="advanced-toggle-row">
            <button id="advancedToggleBtn" class="advanced-toggle-btn" aria-expanded="false" disabled>Advanced search (SQL) <span class="advanced-toggle-arrow">▾</span></button>
        </div>
        <div class="advanced-panel" id="advancedPanel">
            <div class="advanced-panel-inner">
            <textarea id="sqlInput" class="sql-input" spellcheck="false" placeholder="SELECT * FROM anime WHERE average_score > 80 ORDER BY average_score DESC LIMIT 20;"></textarea>
            <div class="advanced-panel-actions">
                <button id="runSqlBtn" class="retry-btn">Run query</button>
                <div class="sql-templates">
                    <button type="button" class="retry-btn sql-template-btn" data-template="topAnime">Top rated anime</button>
                    <button type="button" class="retry-btn sql-template-btn" data-template="busiestVas">Busiest voice actors</button>
                </div>
            </div>
            <div class="advanced-hint">Read-only — only SELECT statements are allowed. Tables: anime, characters, voice_actors, character_anime, character_anime_voice_actor.</div>
            <div id="sqlResults" class="sql-results"></div>
            </div>
        </div>
    </section>

    <section class="detail" id="detailView"></section>

    <section class="section" id="season-section">
        <div class="section-header">
            <div class="season-nav">
                <button id="seasonPrevBtn" class="nav-arrow" title="Older season">‹</button>
                <div class="season-picker">
                    <button id="seasonTitleBtn" class="season-title-btn">
                        <h2 id="season-title"></h2>
                    </button>
                    <div id="seasonPickerPanel" class="season-picker-panel"></div>
                </div>
                <button id="seasonNextBtn" class="nav-arrow" title="Newer season">›</button>
            </div>
            <select id="sortSelect" class="season-select">
                <option value="role_count">Most Roles</option>
                <option value="name">Alphabetical (A–Z)</option>
                <option value="favorites">★ Favorites</option>
            </select>
        </div>
        <div class="grid" id="seasonGrid"></div>
        <div class="load-more-wrap">
            <button id="loadMoreBtn" class="retry-btn" style="display:none">Show more</button>
        </div>
    </section>
</main>

<footer>
    <div class="container footer-inner">
        <span>AniVoice &copy; <span id="year"></span> &nbsp;·&nbsp; Local SQLite database &nbsp;·&nbsp; No API calls</span>
        <a href="https://github.com/kotaroooooooooo/kotaroooooooooo.github.io" target="_blank" rel="noopener">GitHub ↗</a>
    </div>
</footer>
</body>
</html>
